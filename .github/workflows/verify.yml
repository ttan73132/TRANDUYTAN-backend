name: Verify Backend
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run models:fetch
      - run: npm test
