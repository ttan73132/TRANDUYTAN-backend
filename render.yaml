# Review in your own Render account before applying. No service is created by this file alone.
services:
  - type: web
    name: nguyen-hoai-nam-attendance-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run models:fetch
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: TRUST_PROXY
        value: "true"
      - key: APP_TIME_ZONE
        value: Asia/Bangkok
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Chấm công Nguyễn Hoài Nam
databases:
  - name: attendance-db
    plan: free
    databaseName: attendance
